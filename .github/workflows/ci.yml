name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate dotfiles
    runs-on: macos-15
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      ORIGIN_SYSTEM: aarch64-darwin
      TYNIX_REPO: ${{ github.workspace }}/ubugeeei-prod/tynix
    steps:
      # Mirror the local <owner>/<repo> workspace layout so the relative
      # declarationPacks paths in tynix.config.tynix resolve.
      - name: Checkout dotfiles
        uses: actions/checkout@v6
        with:
          path: ubugeeei/origin

      - name: Checkout tynix
        uses: actions/checkout@v6
        with:
          repository: ubugeeei-prod/tynix
          path: ubugeeei-prod/tynix

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Generate runtime Nix from tynix
        working-directory: ubugeeei/origin
        run: ./src/tynix/sync.sh

      - name: Check tynix workspace
        working-directory: ubugeeei/origin
        run: nix run "path:$TYNIX_REPO#tynix" -- check ./src/tynix/workspace.tynix

      - name: Check flake evaluation
        working-directory: ubugeeei/origin
        run: nix flake check --no-build "path:$PWD"

      - name: Check shell startup script
        working-directory: ubugeeei/origin
        run: nix shell --inputs-from "path:$PWD" nixpkgs#shellcheck -c shellcheck -s bash src/templates/nix/home/shell/run-fastfetch-once.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test Rust toolchain selection
        working-directory: ubugeeei/origin
        run: python3 -m unittest discover -s tests -v

      - name: Build managed toolchains
        working-directory: ubugeeei/origin
        run: nix build --out-link result-toolchains "path:$PWD#origin-toolchains"

      - name: Build and test GUI shell startup and prompt
        working-directory: ubugeeei/origin
        run: |
          nix build --out-link result-ush "path:$PWD#ush"
          python3 tests/smoke_shell.py ./result-ush/bin/ush -v

      - name: Smoke test managed commands and task-only mise
        working-directory: ubugeeei/origin
        run: |
          set -euo pipefail
          for command in bun deno jj just uv dprint git-cliff wasm-pack pkl vp cargo rustc ghc cabal stack; do
            ./result-toolchains/bin/"$command" --version
          done
          ./result-toolchains/bin/go version
          ./result-toolchains/bin/java -version
          ./result-toolchains/bin/delstack --help >/dev/null
          ./result-toolchains/bin/markgate --help >/dev/null
          project=$(mktemp -d)
          printf '[tools]\nnode = "0.0.0"\n"ubi:go-to-k/markgate" = "0.0.0"\n' > "$project/mise.toml"
          test "$(./result-toolchains/bin/mise -C "$project" ls --current --json)" = '{}'

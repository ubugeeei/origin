name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate dotfiles
    runs-on: macos-15
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      ORIGIN_SYSTEM: aarch64-darwin
      TNIX_REPO: ${{ github.workspace }}/tnix
    steps:
      - name: Checkout dotfiles
        uses: actions/checkout@v6
        with:
          path: dotfiles

      - name: Checkout tnix
        uses: actions/checkout@v6
        with:
          repository: ubugeeei/tnix
          path: tnix

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Generate runtime Nix from tnix
        working-directory: dotfiles
        run: ./src/tnix/sync.sh

      - name: Test repository commands and Pkl schema
        working-directory: dotfiles
        run: nix shell --inputs-from "path:$PWD" nixpkgs#bash nixpkgs#coreutils nixpkgs#jq nixpkgs#pkl nixpkgs#expect --command bash tests/repositories.sh

      - name: Check tnix workspace
        working-directory: dotfiles
        run: nix run "path:$TNIX_REPO#tnix" -- check ./src/tnix/workspace.tnix

      - name: Check flake evaluation
        working-directory: dotfiles
        run: nix flake check --no-build "path:$PWD"

      - name: Test Nix-managed repository commands
        working-directory: dotfiles
        run: |
          command_dir="$(mktemp -d)"
          trap 'rm -rf "$command_dir"' EXIT
          for command_name in clone workspace; do
            command_source="$(REPOSITORY_COMMAND="$command_name" nix build --no-link --print-out-paths --impure --expr '
              let
                repo = builtins.getFlake ("path:" + toString ./.);
                configuration = (builtins.head (builtins.attrValues repo.homeConfigurations)).config;
                command = builtins.getEnv "REPOSITORY_COMMAND";
              in configuration.home.file.${".local/bin/" + command}.source
            ')"
            ln -s "$command_source" "$command_dir/$command_name"
          done
          REPOSITORY_COMMAND_DIR="$command_dir" nix shell --inputs-from "path:$PWD" nixpkgs#bash nixpkgs#coreutils nixpkgs#jq nixpkgs#pkl nixpkgs#expect --command bash tests/repositories.sh
